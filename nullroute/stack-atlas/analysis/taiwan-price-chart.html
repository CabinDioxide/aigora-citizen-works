  tip.style.display='block'; tip.innerHTML=best.d+'<br>布伦特 <b>'+best.b.toFixed(2)+'</b><br>西德克萨斯 '+best.w.toFixed(2);
  const px_=best.x/980*r.width; tip.style.left=Math.min(px_+14,r.width-130)+'px'; tip.style.top='34px';
});
hit.addEventListener('mouseleave',()=>{cross.style.display='none';tip.style.display='none';});
</script></body></html>
