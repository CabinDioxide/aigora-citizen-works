<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1899 铁路转换器 · 三流循环图 v0.9</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="hd">
  <div class="title-block">
    <h1>1899 铁路转换器</h1>
    <div class="sub">UK Three-Flow Map · v0.9</div>
  </div>
  <div class="anchor-block" id="anchor"></div>
</header>

<main class="layout">
  <section class="stage" id="stage" aria-label="五层转换器：能源、机器与线路、运输吞吐、经营账本、资本回流">
    <svg id="flows" aria-hidden="true"></svg>
    <div class="tiers" id="tiers"></div>
    <div class="legend" id="legend">
      <span class="lg"><span class="sw solid"></span>实测比例（同一单位内，丝数与长短按真实数量画）</span>
      <span class="lg"><span class="sw dashed"></span>概念走向（不代表数量）</span>
      <span class="lg"><span class="dot"></span>数据还没接上的断口（点击看原因）</span>
    </div>
  </section>

  <aside id="panel" aria-live="polite">
    <button id="panel-close" aria-label="关闭">×</button>
    <div id="panel-body">
      <div class="cat">机制详解 · Mechanism</div>
      <h2>点击任何一张卡片或红点</h2>
      <p class="claim">每张卡片背后都是一笔账上有据的数字：点开看它在回路里的位置、原始数字、一个日常尺度的参照，和它出自哪张表。</p>
    </div>
  </aside>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
